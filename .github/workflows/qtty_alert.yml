name: Qtty Email Alert

on:
  schedule:
    # 12:00 PM - 1:00 PM - 2:00 PM بتوقيت القاهرة
    - cron: "0 12,13,14 * * *"
      timezone: "Africa/Cairo"

    # آخر فحص الساعة 3:10 PM بتوقيت القاهرة
    - cron: "10 15 * * *"
      timezone: "Africa/Cairo"

  # يسمح بالتشغيل اليدوي في أي وقت للتجربة
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qtty-email-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests

      - name: Check Gmail and send Telegram alert
        run: python check_qtty_alert.py
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          RENDER_SITE_URL: ${{ secrets.RENDER_SITE_URL }}
